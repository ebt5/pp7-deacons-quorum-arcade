<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temple Treasure</title>
  <style>
    body {
      margin: 0;
      background: #1a120b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      border: 4px solid #d4a24c;
      display: block;
    }
  </style>
</head>
<body>
<canvas id="game" width="900" height="520"></canvas>
<script>
  // How fast the explorer square runs, in pixels per second.
  const playerSpeed = 260;
  // The width and height of the explorer square, in pixels.
  const playerSize = 36;
  // How many seconds the temple run lasts.
  const gameSeconds = 45;
  // How many points you get for collecting one coin.
  const pointsPerCoin = 10;
  // The color of the jungle sky behind the temple.
  const backgroundColor = "#1e4d3a";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const gravity = 1400;
  const jumpSpeed = 560;
  const coinRadius = 12;

  const platforms = [
    { x: 0, y: 460, w: 280, h: 24 },
    { x: 360, y: 460, w: 220, h: 24 },
    { x: 660, y: 460, w: 240, h: 24 },
    { x: 140, y: 360, w: 160, h: 18 },
    { x: 420, y: 330, w: 180, h: 18 },
    { x: 680, y: 300, w: 150, h: 18 },
    { x: 240, y: 230, w: 170, h: 18 },
    { x: 500, y: 190, w: 160, h: 18 },
    { x: 40, y: 160, w: 140, h: 18 }
  ];

  const obstacles = [
    { x: 300, y: 436, w: 40, h: 24 },
    { x: 600, y: 436, w: 40, h: 24 },
    { x: 330, y: 342, w: 28, h: 18 },
    { x: 620, y: 312, w: 28, h: 18 }
  ];

  let state = "title";
  let score = 0;
  let timeLeft = gameSeconds;
  const keys = {};
  const player = {
    x: 40,
    y: 400,
    vx: 0,
    vy: 0,
    onGround: false
  };
  let coins = [];

  function randomCoinSpot() {
    const pad = platforms[Math.floor(Math.random() * platforms.length)];
    return {
      x: pad.x + 20 + Math.random() * Math.max(20, pad.w - 40),
      y: pad.y - coinRadius - 6,
      r: coinRadius
    };
  }

  function placeCoins() {
    coins = [randomCoinSpot(), randomCoinSpot(), randomCoinSpot()];
  }

  function resetGame() {
    score = 0;
    timeLeft = gameSeconds;
    player.x = 40;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    placeCoins();
  }

  window.addEventListener("keydown", function (event) {
    keys[event.key] = true;
    if (state === "title" && (event.key === "Enter" || event.key === " ")) {
      resetGame();
      state = "play";
    }
    if (state === "over" && (event.key === "Enter" || event.key === "r" || event.key === "R")) {
      resetGame();
      state = "play";
    }
    if (event.key === "ArrowUp" || event.key === "ArrowDown" || event.key === "ArrowLeft" || event.key === "ArrowRight" || event.key === " ") {
      event.preventDefault();
    }
  });

  window.addEventListener("keyup", function (event) {
    keys[event.key] = false;
  });

  function hitBox(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    player.vx = 0;
    if (keys["ArrowLeft"]) player.vx = -playerSpeed;
    if (keys["ArrowRight"]) player.vx = playerSpeed;
    if ((keys["ArrowUp"] || keys[" "]) && player.onGround) {
      player.vy = -jumpSpeed;
      player.onGround = false;
    }

    player.vy += gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.onGround = false;

    if (player.x < 0) player.x = 0;
    if (player.x + playerSize > canvas.width) player.x = canvas.width - playerSize;

    const body = { x: player.x, y: player.y, w: playerSize, h: playerSize };
    for (let i = 0; i < platforms.length; i++) {
      const pad = platforms[i];
      if (!hitBox(body, pad)) continue;
      const prevBottom = player.y - player.vy * dt + playerSize;
      if (player.vy >= 0 && prevBottom <= pad.y + 8) {
        player.y = pad.y - playerSize;
        player.vy = 0;
        player.onGround = true;
      }
    }

    if (player.y > canvas.height) {
      state = "over";
      return;
    }

    for (let i = 0; i < obstacles.length; i++) {
      if (hitBox(body, obstacles[i])) {
        state = "over";
        return;
      }
    }

    for (let i = 0; i < coins.length; i++) {
      const coin = coins[i];
      const closestX = Math.max(player.x, Math.min(coin.x, player.x + playerSize));
      const closestY = Math.max(player.y, Math.min(coin.y, player.y + playerSize));
      const distX = coin.x - closestX;
      const distY = coin.y - closestY;
      if (distX * distX + distY * distY <= coin.r * coin.r) {
        score += pointsPerCoin;
        coins[i] = randomCoinSpot();
      }
    }

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      state = "over";
    }
  }

  function drawTemple() {
    ctx.fillStyle = "#6b4f2a";
    ctx.fillRect(0, 484, canvas.width, 36);
    for (let i = 0; i < platforms.length; i++) {
      const pad = platforms[i];
      ctx.fillStyle = "#8a6a3b";
      ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
      ctx.fillStyle = "#c4a46a";
      ctx.fillRect(pad.x, pad.y, pad.w, 4);
    }
    for (let i = 0; i < obstacles.length; i++) {
      const spike = obstacles[i];
      ctx.fillStyle = "#b23b3b";
      ctx.beginPath();
      ctx.moveTo(spike.x, spike.y + spike.h);
      ctx.lineTo(spike.x + spike.w / 2, spike.y);
      ctx.lineTo(spike.x + spike.w, spike.y + spike.h);
      ctx.fill();
    }
  }

  function drawPlayer() {
    ctx.fillStyle = "#c48a3a";
    ctx.fillRect(player.x, player.y, playerSize, playerSize);
    ctx.fillStyle = "#5c3b1e";
    ctx.fillRect(player.x + 4, player.y - 8, playerSize - 8, 10);
    ctx.fillStyle = "#222";
    ctx.fillRect(player.x + 8, player.y + 12, 6, 6);
    ctx.fillRect(player.x + playerSize - 14, player.y + 12, 6, 6);
  }

  function drawCoins() {
    for (let i = 0; i < coins.length; i++) {
      const coin = coins[i];
      ctx.fillStyle = "#f5c518";
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#8a6a12";
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.fillText("$", coin.x, coin.y + 5);
    }
  }

  function draw() {
    ctx.fillStyle = backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (state === "title") {
      ctx.fillStyle = "#f5c518";
      ctx.textAlign = "center";
      ctx.font = "bold 52px Arial";
      ctx.fillText("Temple Treasure", canvas.width / 2, 160);
      ctx.fillStyle = "#ffffff";
      ctx.font = "22px Arial";
      ctx.fillText("Arrow keys move. Up or Space jumps.", canvas.width / 2, 230);
      ctx.fillText("Grab golden coins. Avoid red spikes and pits.", canvas.width / 2, 268);
      ctx.fillText("Press Enter to enter the temple", canvas.width / 2, 340);
      return;
    }

    drawTemple();
    drawCoins();
    drawPlayer();

    ctx.fillStyle = "#ffffff";
    ctx.font = "24px Arial";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 16, 32);
    ctx.textAlign = "right";
    ctx.fillText("Time: " + Math.ceil(timeLeft), canvas.width - 16, 32);

    if (state === "over") {
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f5c518";
      ctx.textAlign = "center";
      ctx.font = "bold 52px Arial";
      ctx.fillText("Game Over", canvas.width / 2, 200);
      ctx.fillStyle = "#ffffff";
      ctx.font = "28px Arial";
      ctx.fillText("Score: " + score, canvas.width / 2, 258);
      ctx.font = "22px Arial";
      ctx.fillText("Press Enter to try the temple again", canvas.width / 2, 318);
    }
  }

  let lastTime = 0;
  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    if (state === "play") update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
