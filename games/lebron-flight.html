<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeBron Flight</title>
<style>
  :root {
    --court: #f5c96a;
    --sky: #7ed6ff;
    --navy: #17233d;
    --gold: #f7c948;
    --orange: #ff8a3d;
    --red: #e95454;
    --white: #fffdf7;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #101729;
    overflow: hidden;
  }
  body { display: grid; place-items: center; }
  #wrap {
    position: relative;
    width: min(94vw, 900px);
    aspect-ratio: 16 / 10;
    max-height: 94vh;
    border: 5px solid #0b1020;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,.4);
    background: var(--sky);
  }
  canvas { width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }
  #score {
    position: absolute;
    left: 20px;
    top: 14px;
    color: white;
    font-weight: 1000;
    font-size: clamp(30px, 5vw, 54px);
    line-height: 1;
    text-shadow: 0 3px 0 #101729, 0 5px 14px rgba(0,0,0,.24);
    letter-spacing: -2px;
  }
  #speed {
    position: absolute;
    right: 18px;
    top: 16px;
    padding: 7px 11px;
    border-radius: 999px;
    color: #fff;
    background: rgba(16,23,41,.72);
    font-weight: 800;
    font-size: 14px;
    border: 2px solid rgba(255,255,255,.24);
  }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: rgba(8,13,28,.46);
    backdrop-filter: blur(3px);
  }
  .panel {
    width: min(86%, 560px);
    padding: 26px 28px 24px;
    border: 4px solid #0b1020;
    border-radius: 24px;
    background: linear-gradient(180deg, #fffdf7, #ffeec4);
    color: var(--navy);
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,.32);
  }
  .title {
    margin: 0 0 7px;
    font-size: clamp(38px, 7vw, 72px);
    line-height: .9;
    font-weight: 1000;
    letter-spacing: -3px;
  }
  .subtitle {
    margin: 0 0 18px;
    font-size: 16px;
    font-weight: 750;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 18px;
  }
  .pill {
    padding: 8px 12px;
    background: white;
    border: 2px solid #d2c39f;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
  }
  button {
    appearance: none;
    border: 0;
    border-radius: 14px;
    background: var(--navy);
    color: white;
    padding: 13px 22px;
    font-size: 17px;
    font-weight: 950;
    cursor: pointer;
    box-shadow: 0 5px 0 #070b15;
    transition: transform .08s ease, filter .12s ease;
  }
  button:hover { filter: brightness(1.14); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #070b15; }
  #status {
    margin: 8px 0 0;
    font-weight: 850;
    min-height: 23px;
  }
  .tiny { font-size: 12px; opacity: .72; margin-top: 13px; }
  @media (max-width: 620px) {
    #wrap { border-width: 3px; border-radius: 15px; }
    .panel { padding: 22px 18px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="560" aria-label="LeBron Flight game"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="speed">SPEED 1.0x</div>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1 class="title">LEBRON<br>FLIGHT</h1>
      <p class="subtitle">Bounce through the hoops. Don't get packed!</p>
      <div class="controls">
        <span class="pill">↑ / SPACE = Jump</span>
        <span class="pill">Avoid the moving obstacles</span>
        <span class="pill">+10 points = slightly faster</span>
      </div>
      <button id="startBtn">START GAME</button>
      <div id="status"></div>
      <div class="tiny">Fan-made cartoon game. No official affiliation.</div>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const speedEl = document.getElementById('speed');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');

  const W = canvas.width, H = canvas.height;
  const groundY = H - 58;

  // Difficulty is deliberately conservative so each 10-point speed bump is noticeable, not brutal.
  const BASE_SPEED = 205;
  const SPEED_STEP = 18;
  const MAX_SPEED_BONUS = 6;
  const GRAVITY = 1200;
  const JUMP_VELOCITY = -425;
  const PLAYER_X = 205;
  const PLAYER_RADIUS = 24;
  const OBSTACLE_WIDTH = 78;
  const GAP_HEIGHT = 172;
  const SPAWN_DISTANCE = 345;

  let state = 'ready';
  let score = 0;
  let best = Number(localStorage.getItem('lebronFlightBest') || 0);
  let elapsed = 0;
  let spawnTimer = 0;
  let nextId = 1;
  let obstacles = [];
  let particles = [];
  let clouds = [];
  let shake = 0;

  const player = { x: PLAYER_X, y: H * .46, vy: 0, rotation: 0, bob: 0 };

  // Decorative clouds are placed once for a smoother background.
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 50 + Math.random() * 170,
      s: .65 + Math.random() * .8,
      speed: 8 + Math.random() * 13
    });
  }

  function resetGame() {
    state = 'playing';
    score = 0;
    elapsed = 0;
    spawnTimer = .8;
    nextId = 1;
    obstacles = [];
    particles = [];
    player.y = H * .46;
    player.vy = 0;
    player.rotation = 0;
    shake = 0;
    scoreEl.textContent = '0';
    speedEl.textContent = 'SPEED 1.0x';
    overlay.style.display = 'none';
  }

  function currentSpeed() {
    const bonusLevels = Math.min(MAX_SPEED_BONUS, Math.floor(score / 10));
    return BASE_SPEED + bonusLevels * SPEED_STEP;
  }

  function jump() {
    if (state === 'ready' || state === 'gameover') {
      resetGame();
    }
    if (state === 'playing') {
      player.vy = JUMP_VELOCITY;
      burst(player.x - 6, player.y + 23, 5, 0.25);
    }
  }

  function spawnObstacle(x = W + 40) {
    const minTop = 74;
    const maxTop = groundY - GAP_HEIGHT - 74;
    const gapTop = minTop + Math.random() * Math.max(1, maxTop - minTop);
    const wobble = (Math.random() - .5) * 12;
    obstacles.push({
      id: nextId++, x, gapTop, width: OBSTACLE_WIDTH, passed: false,
      phase: Math.random() * Math.PI * 2,
      wobble,
      amplitude: 16 + Math.random() * 18,
      speed: .75 + Math.random() * .45
    });
  }

  function update(dt) {
    elapsed += dt;

    for (const c of clouds) {
      c.x -= c.speed * dt;
      if (c.x < -150) c.x = W + 70;
    }

    if (state !== 'playing') return;

    const speed = currentSpeed();
    speedEl.textContent = `SPEED ${(speed / BASE_SPEED).toFixed(1)}x`;

    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    player.rotation = Math.max(-0.42, Math.min(1.0, player.vy / 700));
    player.bob += dt * 10;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const last = obstacles[obstacles.length - 1];
      if (!last || last.x < W - 250) spawnObstacle();
      spawnTimer = SPAWN_DISTANCE / speed;
    }

    for (const o of obstacles) {
      o.x -= speed * dt;
      const dy = Math.sin(elapsed * o.speed * 2 + o.phase) * o.amplitude + o.wobble;
      o.renderGapTop = o.gapTop + dy;

      if (!o.passed && o.x + o.width < player.x - PLAYER_RADIUS) {
        o.passed = true;
        score += 1;
        scoreEl.textContent = score;
        burst(o.x + o.width, o.renderGapTop + GAP_HEIGHT / 2, 7, 0.5);
      }

      const circleHit = circleRectCollision(player.x, player.y, PLAYER_RADIUS - 3, o.x, 0, o.width, o.renderGapTop)
        || circleRectCollision(player.x, player.y, PLAYER_RADIUS - 3, o.x, o.renderGapTop + GAP_HEIGHT, o.width, groundY - (o.renderGapTop + GAP_HEIGHT));
      if (circleHit) gameOver();
    }

    obstacles = obstacles.filter(o => o.x > -100);

    if (player.y - PLAYER_RADIUS < 0 || player.y + PLAYER_RADIUS > groundY) gameOver();

    updateParticles(dt);
    shake = Math.max(0, shake - dt);
  }

  function circleRectCollision(cx, cy, r, rx, ry, rw, rh) {
    if (rw <= 0 || rh <= 0) return false;
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function gameOver() {
    if (state !== 'playing') return;
    state = 'gameover';
    shake = .22;
    best = Math.max(best, score);
    localStorage.setItem('lebronFlightBest', String(best));
    burst(player.x, player.y, 18, 1.0);
    overlay.style.display = 'grid';
    startBtn.textContent = 'PLAY AGAIN';
    statusEl.innerHTML = `Score: <b>${score}</b> &nbsp; • &nbsp; Best: <b>${best}</b>`;
  }

  function burst(x, y, amount, life) {
    for (let i = 0; i < amount; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 130;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: 2 + Math.random() * 4 });
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 260 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - .5) * 10 * (shake / .22), (Math.random() - .5) * 8 * (shake / .22));
    }
    drawBackground();
    drawObstacles();
    drawGround();
    drawPlayer();
    drawParticles();
    ctx.restore();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#6fd0ff');
    sky.addColorStop(.68, '#bff0ff');
    sky.addColorStop(.68, '#f7d785');
    sky.addColorStop(1, '#e9ad54');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Soft sun halo.
    ctx.globalAlpha = .25;
    ctx.fillStyle = '#fff7b0';
    ctx.beginPath(); ctx.arc(W - 105, 90, 62, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    for (const c of clouds) drawCloud(c);

    // Distant arena silhouette.
    ctx.fillStyle = 'rgba(33,49,78,.12)';
    for (let x = 0; x < W; x += 48) {
      const h = 25 + ((x * 17) % 70);
      ctx.fillRect(x, groundY - 38 - h, 30, h);
    }
  }

  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.beginPath();
    ctx.arc(0, 12, 20, 0, Math.PI * 2);
    ctx.arc(23, 4, 26, 0, Math.PI * 2);
    ctx.arc(53, 14, 18, 0, Math.PI * 2);
    ctx.roundRect(-18, 12, 90, 26, 13);
    ctx.fill();
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#ca8a45';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#8d5930';
    ctx.fillRect(0, groundY, W, 5);
    ctx.strokeStyle = 'rgba(75,45,28,.22)';
    ctx.lineWidth = 3;
    for (let x = -40; x < W + 40; x += 80) {
      ctx.beginPath(); ctx.moveTo(x, groundY + 25); ctx.lineTo(x + 28, H); ctx.stroke();
    }
  }

  function drawObstacles() {
    for (const o of obstacles) {
      const gapTop = o.renderGapTop ?? o.gapTop;
      drawBasketPost(o.x, gapTop - 18, o.width, 18, true);
      drawBasketPost(o.x, gapTop + GAP_HEIGHT, o.width, groundY - (gapTop + GAP_HEIGHT), false);

      // glowing hoop in the middle of the gap
      const hx = o.x + o.width * .5;
      const hy = gapTop + GAP_HEIGHT * .5;
      ctx.strokeStyle = '#ff5b35';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(hx, hy, 29, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.65)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, hy, 29, 0, Math.PI * 2); ctx.stroke();

      // Net lines.
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 2;
      for (let i = -16; i <= 16; i += 8) {
        ctx.beginPath(); ctx.moveTo(hx + i, hy + 28); ctx.lineTo(hx + i * .62, hy + 52); ctx.stroke();
      }
    }
  }

  function drawBasketPost(x, y, w, h, fromTop) {
    ctx.save();
    const g = ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, '#17233d');
    g.addColorStop(.5, '#364b78');
    g.addColorStop(1, '#17233d');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#0b1020';
    ctx.lineWidth = 4;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(x + 10, y + 7, 11, Math.max(0, h - 14));
    ctx.restore();
  }

  function drawPlayer() {
    const bob = state === 'ready' ? Math.sin(elapsed * 3.3) * 7 : Math.sin(player.bob) * 2;
    ctx.save();
    ctx.translate(player.x, player.y + bob);
    ctx.rotate(player.rotation);
    drawLeBron();
    ctx.restore();
  }

  // Stylized, fictional cartoon basketball-player character.
  function drawLeBron() {
    // shadow
    ctx.globalAlpha = .18;
    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.ellipse(0, 33, 29, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // Legs: thicker, athletic stance
    ctx.strokeStyle = '#171a25'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, 18); ctx.lineTo(-14, 39); ctx.moveTo(10, 18); ctx.lineTo(17, 39); ctx.stroke();
    // Athletic calves
    ctx.strokeStyle = '#8d583d'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-13, 28); ctx.lineTo(-14, 39); ctx.moveTo(13, 28); ctx.lineTo(17, 39); ctx.stroke();
    // shoes
    ctx.fillStyle = '#f2f4f7';
    ctx.beginPath(); ctx.roundRect(-23, 35, 22, 10, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(8, 35, 23, 10, 4); ctx.fill();
    ctx.strokeStyle = '#17233d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-19, 39); ctx.lineTo(-6, 39); ctx.moveTo(12, 39); ctx.lineTo(25, 39); ctx.stroke();

    // Broad, V-shaped torso / bodybuilder chest
    ctx.fillStyle = '#6b4bc2';
    ctx.beginPath();
    ctx.moveTo(-28, 0); ctx.quadraticCurveTo(-30, 7, -27, 16);
    ctx.lineTo(-21, 30); ctx.quadraticCurveTo(0, 37, 21, 30);
    ctx.lineTo(27, 16); ctx.quadraticCurveTo(30, 7, 28, 0);
    ctx.quadraticCurveTo(14, -7, 0, -4);
    ctx.quadraticCurveTo(-14, -7, -28, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#17233d'; ctx.lineWidth = 4; ctx.stroke();
    // Chest definition
    ctx.strokeStyle = 'rgba(23,35,61,.55)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(0, 25); ctx.moveTo(-22, 8); ctx.quadraticCurveTo(-11, 1, 0, 7); ctx.moveTo(0, 7); ctx.quadraticCurveTo(11, 1, 22, 8); ctx.stroke();
    ctx.fillStyle = '#f6c945';
    ctx.font = '900 16px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('23', 0, 17);

    // Huge muscular arms and rounded deltoids
    ctx.fillStyle = '#8d583d';
    ctx.beginPath();
    ctx.ellipse(-28, 5, 9, 12, -.45, 0, Math.PI * 2);
    ctx.ellipse(28, 4, 9, 12, .45, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6d412e'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#8d583d'; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(-29, 6); ctx.lineTo(-42, 15); ctx.moveTo(29, 5); ctx.lineTo(42, -2); ctx.stroke();
    // biceps highlights
    ctx.strokeStyle = 'rgba(255,205,170,.42)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-34, 9); ctx.quadraticCurveTo(-39, 12, -40, 15); ctx.moveTo(34, 7); ctx.quadraticCurveTo(39, 3, 40, 0); ctx.stroke();
    // wristbands
    ctx.strokeStyle = '#f5f0e8'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-38, 12); ctx.lineTo(-42, 15); ctx.moveTo(38, 0); ctx.lineTo(42, -2); ctx.stroke();

    // Thick neck
    ctx.fillStyle = '#8d583d'; ctx.fillRect(-9, -13, 18, 12);
    ctx.fillStyle = 'rgba(255,205,170,.35)'; ctx.fillRect(-6, -10, 5, 9);
    // head
    ctx.fillStyle = '#9c6245';
    ctx.beginPath(); ctx.arc(0, -21, 19, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#17233d'; ctx.lineWidth = 4; ctx.stroke();
    // hairline
    ctx.fillStyle = '#252329';
    ctx.beginPath();
    ctx.arc(0, -27, 17, Math.PI, Math.PI * 2);
    ctx.lineTo(10, -38); ctx.lineTo(6, -30); ctx.lineTo(2, -34); ctx.lineTo(-3, -30); ctx.lineTo(-8, -34); ctx.lineTo(-14, -27);
    ctx.closePath(); ctx.fill();
    // eyebrows + eyes
    ctx.strokeStyle = '#3a2218'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-11, -24); ctx.lineTo(-4, -26); ctx.moveTo(4, -26); ctx.lineTo(11, -24); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7, -20, 4, 0, Math.PI * 2); ctx.arc(7, -20, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#182033';
    ctx.beginPath(); ctx.arc(-7, -20, 2, 0, Math.PI * 2); ctx.arc(7, -20, 2, 0, Math.PI * 2); ctx.fill();
    // beard + smile
    ctx.fillStyle = '#3a241b';
    ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = '#fff3e8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -11, 7, 0.15, Math.PI - .15); ctx.stroke();

    // basketball in hand
    ctx.fillStyle = '#e8752d';
    ctx.beginPath(); ctx.arc(36, -3, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5b321c'; ctx.lineWidth = 1.7;
    ctx.beginPath(); ctx.arc(36, -3, 10, -1.1, 1.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(29, -10); ctx.quadraticCurveTo(40, -3, 43, 6); ctx.stroke();

    // little cape-like motion streak, purely decorative
    ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-31, -7); ctx.lineTo(-47, -12); ctx.moveTo(-33, -1); ctx.lineTo(-52, -2); ctx.stroke();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = '#fff6c6';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function handleInput(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    }
  }

  window.addEventListener('keydown', handleInput);
  canvas.addEventListener('pointerdown', jump);
  startBtn.addEventListener('click', resetGame);

  statusEl.textContent = `Best score: ${best}`;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
